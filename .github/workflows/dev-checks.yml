name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" >/dev/null || true
          test -d "$ANDROID_HOME/platforms/android-37"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Unit tests
        run: gradle :app:test

      - name: Release lint
        run: gradle :app:lintRelease

      - name: Build release and enforce size budget
        run: gradle :app:checkReleaseSize
